# Builds Setup86.exe (the Disc Builder app, with setup86.py and MENU.EXE inside) on Windows.
# On a v* tag it is attached to that GitHub release; run by hand, it is kept as a workflow artifact.
name: Windows app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install pycdlib pillow pyinstaller

      - name: Check that the app imports
        run: python -c "import setup86, setup86_gui; print('Setup86', setup86.VERSION)"

      - name: Build Setup86.exe
        run: >
          pyinstaller --onefile --windowed --name Setup86
          --icon art/setup86.ico
          --add-data "dosmenu/MENU.EXE;dosmenu"
          --add-data "art/setup86-icon-128.png;art"
          setup86_gui.py

      - uses: actions/upload-artifact@v4
        with:
          name: Setup86-windows
          path: dist/Setup86.exe

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.ref_name }} dist/Setup86.exe --clobber
